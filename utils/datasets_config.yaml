# Dataset configuration
- name: "CICEVSE2024 Dataset"
  path: "data/parquets/cicevse_network.parquet"
  target_column: "target"
  columns_to_drop_power_consumption: ['time', 'Attack-Group', 'Label', 'interface']

- name: "CIC IoV dataset 2024"
  path: "data/parquets/ciciov.parquet"
  target_column: "target"

- name: "CIC IDS 2017"
  path_train: "data/parquets/train_set.parquet"
  path_val: "data/parquets/crossval_set.parquet"
  target_column: "label"
  columns_to_drop_CIC: ["flag_urg", "fwd_flag_urg", "bwd_flag_urg", "flow_id", "timestamp", "src_addr", "dst_addr"]