# Dataset selection
selected-dataset: "CICIDS2017" #"CICEVSE_Network2024" # CICEVSE_PowerB2024 # "CICIoV2024" "CICIDS2017"
mode: "prototypical"
params:
  train-batch-size: 32
  val-batch-size: 512
  epochs: 10
  lr: 0.005
  n_episodes: 200
  n_support: 40
  n_query: 20
  n_experiments: 40
  n_samples: 200
  sample_per_class: 2
scenarios:
  - polyak: false
    vals: ["0", "1/3", "1/3", "1/3"]
  - polyak: false
    vals: ["1/3", "1/3", "1/3", "0"]
  - polgyak: false
    vals: ["1/2", "0", "1/2", "0"]
  - polgyak: false
    vals: ["1/4", "1/4", "1/4", "1/4"]
  - polayak: true
    vals: ["1/2", "0", "1/2", "0"]
  - polayak: true
    vals: ["1/4", "1/4", "1/4", "1/4"]
  - polayak: true
    vals: ["1", "0", "0", "0"]
  - polayak: false
    vals: ["0", "1/2", "0", "1/2"]
  - polyak: true
    vals: ["1/3", "1/3", "1/3", "0"]
  - polyak: true
    vals: ["0", "1/3", "1/3", "1/3"]
