# Dataset selection
selected-dataset: "CICEVSE_PowerB2024" #"CICEVSE_Network2024" # CICEVSE_PowerB2024 # "CICIoV2024" "CICIDS2017"
mode: "baseline"
params:
  train-batch-size: 32
  val-batch-size: 512
  epochs: 10
  lr: 0.005
  n_episodes: 200
  n_support: 40
  n_query: 20
  n_experiments: 40
  n_samples: 200
  sample_per_class: 2
scenarios: ["logistic_regression", "random_forest", "gradient_boosting", "knn"]
output:
  train-history: "train_history" # Directory for training outputs
  best_models: "models/saved_models/best_model_" # Directory for saving best models
